name: Randomized physical object learning
on:
  push:
    branches:
      - feature/embodied-learning-v1
  pull_request:
    paths:
      - autonomy/affordance_model.py
      - affordance_rollouts.py
      - autonomous_world.py
      - tests/test_affordance_model.py
      - tests/test_world_scene.py
      - tests/test_integrated_replay.py
      - .github/workflows/randomized-object-learning.yml
jobs:
  physics-and-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'mujoco==3.2.7' 'numpy>=1.26,<3'
      - name: Unit tests of model inputs and supervised learning
        run: python -m unittest discover -s tests -p test_affordance_model.py -v
      - name: Test multi-object procedural environments
        run: python -m unittest discover -s tests -p test_world_scene.py -v
      - name: Check continuous-session replay input hygiene
        run: python -m unittest discover -s tests -p test_integrated_replay.py -v
      - name: Randomized physical encounters with independent test scenes
        run: python affordance_rollouts.py --output runs/embodied
      - name: Validate physics dataset and report (do not assume improvement)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('runs/embodied/report.json').read_text())
          print('RANDOMIZED PHYSICS',d)
          assert d['train_attempts']==32 and d['test_attempts']==16
          assert d['train_valid']>=8 and d['test_valid']>=5
          assert d['test_metrics']['samples']==d['test_valid']
          assert Path('runs/embodied/model.json').is_file()
          PY
      - name: Continuous single-world autonomous investigation (3 seeds)
        run: |
          for seed in 7 11 23; do
            python autonomous_world.py --seed "$seed" --seconds 90 \
              --model runs/embodied/model.json --experience runs/embodied/train/episodes.json --output "runs/integrated/seed_$seed"
          done
      - name: Audit continuous MuJoCo session outcomes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(Path(f'runs/integrated/seed_{x}/report.json').read_text()) for x in (7,11,23)]
          for row in rows:print('INTEGRATED',row)
          assert all(r['sensor_surveys']>0 and r['object_hypotheses']>0 for r in rows)
          assert all(r['elapsed_s']>=1 for r in rows)
          assert any(r['new_labeled_samples']>0 and r['online_network_updates']>0 for r in rows)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: randomized-object-learning
          path: |
            runs/embodied/
            runs/integrated/
