name: Train calibrated hexapod gait
on:
  push:
    branches: [diploma/adaptive-locomotion]
    paths: ['hexapod/training.py', 'hexapod/geometry.py', '.github/workflows/diploma-train-gait.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-laptop.txt
      - run: python -m hexapod.training --run-dir runs/calibrated
      - uses: actions/upload-artifact@v4
        with:
          name: calibrated-gait
          path: |
            hexapod/weights/gait_ppo.npz
            validation/diploma/gait*.json
      - name: Publish measured weights and evaluations on the training branch
        if: github.ref == 'refs/heads/diploma/adaptive-locomotion'
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add hexapod/weights/gait_ppo.npz validation/diploma/gait*.json
          git diff --cached --quiet && exit 0
          git commit -m "Ship motion-tested PPO weights and independent evaluations"
          git pull --rebase origin diploma/adaptive-locomotion
          git push origin HEAD:diploma/adaptive-locomotion
