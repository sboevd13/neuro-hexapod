name: Learn object affordances in MuJoCo

on:
  push:
    branches: [feature/object-affordances-v1]
  pull_request:
    paths:
      - autonomy/interaction.py
      - interact_laptop.py
      - tests/test_interaction.py
      - locomotion_laptop.py
      - docs/interaction.md
      - .github/workflows/object-affordances.yml

jobs:
  object-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MuJoCo and NumPy
        run: python -m pip install 'numpy>=1.26,<3' 'mujoco==3.2.7'
      - name: Test object sensing and learning
        run: |
          python -m unittest discover -s tests -p test_interaction.py -v
          python -m unittest discover -s tests -p test_curiosity.py -v
      - name: Run four actual contact-physics object trials
        run: python interact_laptop.py --seconds 8 --seed 7 --output runs/affordances
      - name: Validate physics, observations and transfer
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('runs/affordances/report.json').read_text())
          trials=d['trials']
          for t in trials:
              print(t['case'], t['signature'], t['action'],
                    'lidar delta', t['sensed_motion_m'],
                    'truth delta', t['known_for_evaluation_only']['ground_truth_displacement_x_m'],
                    'touch',t['touch'],'fell',t['fell'])
          assert len(trials)==4
          assert all(not t['fell'] for t in trials), 'Robot fell during contact experiment'
          assert [t['signature'] for t in trials]==['narrow','wide','narrow','wide'], 'Object size signature mismatch'
          assert trials[0]['action']=='probe'
          assert trials[1]['action']=='probe'
          # These assertions are deliberately strict: we must observe an
          # actual MuJoCo contact and object movement before claiming learning.
          assert trials[0]['touch'], 'Light box not reached / touched'
          assert trials[0]['known_for_evaluation_only']['ground_truth_displacement_x_m'] > 0.035, 'Light box did not physically move'
          assert trials[0]['sensed_motion_m'] is not None and trials[0]['sensed_motion_m']>0.025, 'Lidar failed to perceive object movement'
          assert trials[1]['touch'], 'Fixed box not touched'
          assert abs(trials[1]['known_for_evaluation_only']['ground_truth_displacement_x_m'])<0.001, 'Fixed box moved'
          assert trials[1]['sensed_motion_m'] is not None and abs(trials[1]['sensed_motion_m'])<0.035, 'Lidar falsely classifies fixed box as movable'
          assert trials[2]['action']=='probe', 'Did not transfer small object affordance'
          assert trials[3]['action']=='observe', 'Did not avoid a second known fixed box'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: object-contact-affordance-experiment
          path: runs/affordances
          retention-days: 14
