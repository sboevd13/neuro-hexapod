name: Format the new diploma modules
on:
  push:
    branches: [diploma/adaptive-locomotion]
    paths: ['.github/workflows/diploma-source-format.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: diploma/adaptive-locomotion}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install ruff==0.11.13
      - name: Apply standard Python formatting to the new runtime and its tests
        run: |
          ruff format hexapod tests/test_diploma.py scripts/check_firmware_ik.py
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add hexapod/*.py tests/test_diploma.py scripts/check_firmware_ik.py
          git diff --cached --quiet && exit 0
          git commit -m "Format the diploma project Python sources"
          git pull --rebase origin diploma/adaptive-locomotion
          git push origin HEAD:diploma/adaptive-locomotion
