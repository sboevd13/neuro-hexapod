name: Navigation multi-seed benchmark

on:
  push:
    branches:
      - feature/learned-behavior-v1
      - agent/residual-reference-gait
  pull_request:
    paths:
      - 'autonomy/**'
      - 'explore_laptop.py'
      - 'benchmark_autonomy.py'
      - 'train_behavior.py'
      - 'models/behavior_v1.json'
      - 'tests/test_behavior.py'
      - 'tests/test_experience.py'
      - 'autonomy/experience.py'
      - 'adapt_behavior.py'
      - 'docs/behavior.md'
      - '.github/workflows/autonomy-benchmark.yml'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'mujoco==3.2.7'
      - run: python -m unittest discover -s tests -p 'test_autonomy.py' -v
      - run: python -m unittest discover -s tests -p 'test_behavior.py' -v
      - run: python -m unittest discover -s tests -p 'test_experience.py' -v
      - name: Verify trained model on new synthetic scenes
        run: python train_behavior.py --train-samples 12000 --test-samples 3000 --epochs 32 --output runs/benchmark/retrained_behavior.json --report runs/benchmark/behavior_validation.json
      - name: Check learned policy improves simulated action selection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('runs/benchmark/behavior_validation.json').read_text())
          assert report['after']['mean_regret'] < report['before']['mean_regret']*0.4, report
          assert report['after']['exact_action_accuracy'] > 0.80, report
          PY
      - name: Baseline exploration on unseen layouts
        run: python benchmark_autonomy.py --mode baseline --seconds 60 --seeds 7 11 23 31 47 59 --output runs/benchmark
      - name: Trained local policy on same layouts
        run: python benchmark_autonomy.py --mode learned --behavior-model models/behavior_v1.json --seconds 60 --seeds 7 11 23 31 47 59 --output runs/benchmark
      - name: Fine-tune on MuJoCo actions from four training scenes
        run: |
          python adapt_behavior.py \
            --model models/behavior_v1.json \
            --experiences runs/benchmark/learned/seed_{7,11,23,31}/experience.jsonl \
            --output runs/benchmark/adapted_behavior.json
      - name: Baseline navigation on six held-out scenes
        run: python benchmark_autonomy.py --mode baseline --seconds 60 --seeds 47 59 71 83 97 109 --output runs/heldout
      - name: Original learned policy on six held-out scenes
        run: python benchmark_autonomy.py --mode learned --behavior-model models/behavior_v1.json --seconds 60 --seeds 47 59 71 83 97 109 --output runs/heldout
      - name: Adapted policy on six held-out scenes
        run: |
          python benchmark_autonomy.py --mode learned \
            --behavior-model runs/benchmark/adapted_behavior.json \
            --seconds 60 --seeds 47 59 71 83 97 109 --output runs/adapted
      - name: Show differences without hiding regressions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('runs/benchmark')
          baseline=json.loads((root/'baseline_summary.json').read_text())['summary']
          learned=json.loads((root/'learned_summary.json').read_text())['summary']
          print('BASELINE',baseline)
          print('LEARNED', learned)
          adapted=json.loads(Path('runs/adapted/learned_summary.json').read_text())['summary']
          print('ADAPTED HELD-OUT', adapted)
          held_base=json.loads(Path('runs/heldout/baseline_summary.json').read_text())['summary']
          held_learned=json.loads(Path('runs/heldout/learned_summary.json').read_text())['summary']
          print('HELD-OUT BASELINE', held_base)
          print('HELD-OUT ORIGINAL', held_learned)
          assert adapted['falls'] == 0, 'Adapted model fell on held-out scenes'
          assert learned['falls'] == 0, 'Regression: learned policy fell'
          interventions=sum(e['neural_decisions'] for e in json.loads((root/'learned_summary.json').read_text())['episodes'])
          assert interventions > 0, 'Neural model never acted'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-benchmark
          path: |
            runs/benchmark
            runs/adapted
            runs/heldout
