name: Qualify six simulated courses
on:
  push:
    branches: [diploma/adaptive-locomotion]
    paths: ['.github/workflows/diploma-courses.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  depth:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install -r requirements-diploma.txt
      - name: Compare adaptive and fixed gait on unseen course seeds
        id: score
        continue-on-error: true
        run: python -m hexapod.benchmark --both --seeds 1307 1601 2141 3229 4523 5021 7351 8369 --output reports/courses_depth.json
      - uses: actions/upload-artifact@v4
        with: {name: depth-trials, path: reports/courses_depth.json, if-no-files-found: error}
      - name: Require the adaptive controller to qualify
        run: test "${{ steps.score.outcome }}" = "success"
  rgb:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      MUJOCO_GL: osmesa
      OPENBLAS_NUM_THREADS: 1
      LP_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: sudo apt-get update -qq && sudo apt-get install -y libosmesa6 libgl1-mesa-dri xvfb xauth ffmpeg
      - run: python -m pip install -r requirements-diploma.txt
      - name: Wait for the trained monocular model
        run: |
          mkdir -p hexapod/weights
          for i in $(seq 1 80); do
            git fetch -q origin diploma/adaptive-locomotion
            if git show FETCH_HEAD:hexapod/weights/camera_rgb.npz >hexapod/weights/camera_rgb.npz 2>/dev/null; then break; fi
            sleep 15
          done
          test -s hexapod/weights/camera_rgb.npz
      - name: Score RGB-only perception on complete physical trials
        id: score
        continue-on-error: true
        run: python -m hexapod.benchmark --camera rgb --seeds 1307 2141 4523 8369 --output reports/courses_rgb.json
      - run: xvfb-run -a python -m hexapod.record_demo reports/demo.mp4
      - uses: actions/upload-artifact@v4
        with: {name: rgb-trials, path: reports/, if-no-files-found: error}
      - name: Require the adaptive controller to qualify with RGB
        run: test "${{ steps.score.outcome }}" = "success"
  publish:
    needs: [depth,rgb]
    if: always() && github.ref == 'refs/heads/diploma/adaptive-locomotion'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: diploma/adaptive-locomotion}
      - uses: actions/download-artifact@v4
        with: {name: depth-trials, path: validation/diploma}
      - uses: actions/download-artifact@v4
        with: {name: rgb-trials, path: validation/diploma}
      - name: Publish measured trials and recording
        run: |
          mkdir -p docs
          mv validation/diploma/demo.mp4 docs/adaptive-demo.mp4
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add validation/diploma/courses_*.json docs/adaptive-demo.mp4
          git diff --cached --quiet && exit 0
          git commit -m "Record measured course outcomes and operator demo"
          git pull --rebase origin diploma/adaptive-locomotion
          git push origin HEAD:diploma/adaptive-locomotion
